# Organization and project key are supplied through GitHub repository variables.
sonar.sources=src,scripts
sonar.tests=tests
sonar.exclusions=src/verdant.d.ts
# Only executable application logic is instrumented. Templates/styles/scripts have separate checks.
sonar.coverage.exclusions=src/content.config.ts,src/styles/**,src/**/*.astro,src/**/*.d.ts,scripts/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
